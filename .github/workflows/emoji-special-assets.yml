name: Curated emoji assets
on:
  push:
    branches: [main]
    paths:
      - 'emoji-special/prepare.py'
      - '.github/workflows/emoji-special-assets.yml'
permissions:
  contents: write
concurrency:
  group: emoji-special-assets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: pip install Pillow==11.3.0
      - name: Pin source commit identifiers and prepare assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('emoji-special/prepare.py')
          s=p.read_text()
          s=s.replace("return d['sha'],", "return json.loads(get('https://api.github.com/repos/'+repo+'/commits/'+ref))['sha'],")
          p.write_text(s)
          PY
          python emoji-special/prepare.py
      - name: Commit only the separate curated pack outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add emoji-special/assets emoji-special/vendor emoji-special/assets.js emoji-special/prepare.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Store verified curated WebP assets and pinned browser runtimes'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emoji-special-assets
          path: |
            emoji-special/assets
            emoji-special/vendor
            emoji-special/assets.js
          retention-days: 7
